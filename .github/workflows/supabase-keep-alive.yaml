name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday (twice a week)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  ping_database:
    runs-on: ubuntu-latest

    steps:
      - name: Send keep-alive request to Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
